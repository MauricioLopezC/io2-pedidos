name: informe

on:
  push:
  pull_request:

jobs:
  informe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: informe

      - uses: actions/upload-artifact@v4
        with:
          name: informe
          path: informe/main.pdf
