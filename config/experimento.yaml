# Parámetros del estudio. Cada sección tiene un responsable (ver README).

# --- Datos (Persona A) -------------------------------------------------------
datos:
  # Histórico del ERP La Linda congelado y versionado. Para regenerarlo:
  #   python scripts/01_preparar_datos.py --desde-erp RUTA/database.sqlite
  erp_csv: datos/raw/erp_web_orders.csv

  # Horario de atención del sector de preparación: [apertura, cierre).
  hora_apertura: 8
  hora_cierre: 21

  # Histórico sintético propio, inspirado en el ERP pero escalado a un
  # supermercado online con volumen suficiente para que la dotación importe.
  generador:
    semilla: 20260416          # la misma semilla que usa el seeder del ERP
    fecha_inicio: 2026-04-20   # lunes; 26 semanas completas
    semanas: 26
    # Pedidos de un día con factor semanal 1,0 (jueves) al inicio del histórico.
    pedidos_dia_inicio: 180
    # Crecimiento compuesto mensual (30 días): ~200 pedidos/día al final.
    crecimiento_mensual: 0.02
    # Variación entre días no explicada por el calendario (coef. de variación
    # de un factor gamma de media 1). Genera sobredispersión frente a Poisson.
    cv_ruido_diario: 0.10
    # Factor por día de la semana (1 = lunes), tomado del seeder del ERP.
    factor_dia_semana: {1: 0.85, 2: 0.90, 3: 0.95, 4: 1.00, 5: 1.20, 6: 1.45, 7: 0.75}
    # Peso relativo de cada hora de apertura (se normaliza a media 1):
    # pico de media mañana y pico más fuerte después del horario laboral.
    perfil_horario: {8: 0.5, 9: 0.8, 10: 1.2, 11: 1.4, 12: 1.2, 13: 0.8, 14: 0.6,
                     15: 0.6, 16: 0.7, 17: 0.9, 18: 1.3, 19: 1.5, 20: 1.1}
    # Líneas (artículos distintos) por pedido: 1 + binomial negativa.
    lineas_media: 12
    lineas_dispersion: 4       # parámetro n de la binomial negativa (menor = más dispersa)
    # Proporción de pedidos con retiro en sucursal (ERP: 62 %).
    proporcion_retiro: 0.62

# --- Pronóstico (Persona A) --------------------------------------------------
pronostico:
  # Últimas semanas de la serie: validación para elegir k y prueba para informar.
  semanas_validacion: 4
  semanas_prueba: 4
  # Candidatos de k para la media estacional (promedio de las últimas k semanas).
  semanas_media: [2, 4, 8]
  # Cobertura del intervalo empírico del pronóstico de la semana siguiente.
  nivel_intervalo: 0.8

# --- Servicio y verificación (Persona B) -------------------------------------
servicio:
  minutos_fijos: 4.0          # Hipótesis de trabajo por pedido, independiente del tamaño.
  minutos_por_linea: 0.5      # Incremento por artículo distinto; variar en la sensibilidad.

verificacion:
  llegadas_h: 12              # Caso sintético estable con esperas observables.
  servicio_h: 9               # Capacidad individual por hora con servicio exponencial.
  dotacion: 2                 # Permite verificar una fila con servidores en paralelo.
  calentamiento_h: 24         # Excluir el transitorio del sistema inicialmente vacío.
  observacion_h: 240          # Ventana de medición posterior al calentamiento.
  replicas: 64                # Medias independientes para estimar el error Monte Carlo.
  confianza: 0.99             # Cobertura nominal marginal del intervalo normal aproximado.
  semilla: 20261111           # Raíz reproducible de las semillas de réplica.

# --- Experimentos y sensibilidad (Persona C) ---------------------------------
experimentos:
  # Plazo objetivo desde la llegada hasta el fin de preparación (en minutos).
  # Con preparación pura de 10 min en promedio (~20 min en pedidos grandes),
  # 30 min deja margen operativo razonable entre espera en fila y armado.
  plazo_min: 30.0
  # Proporción mínima de pedidos de la jornada que deben cumplir el plazo.
  cumplimiento_min: 0.90
  # Días representativos de la semana pronosticada (baja = domingo factor 0,75;
  # media = jueves factor 1,00; alta = sábado factor 1,45).
  escenarios:
    baja: 2026-10-25
    media: 2026-10-22
    alta: 2026-10-24
  # Dotaciones fijas por jornada a comparar con números aleatorios comunes.
  dotaciones: [2, 3, 4, 5, 6, 7, 8]
  # Réplicas independientes por escenario y semilla raíz reproducible.
  replicas: 100
  semilla: 20261112

sensibilidad:
  # Columnas de pronostico_semana_siguiente.csv (intervalo empírico del 80 %).
  curvas_pronostico: [inferior, pronostico, superior]
  # Escalado multiplicativo del pronóstico base (evalúa el sesgo de subestimación).
  factores_demanda: [0.90, 1.00, 1.10, 1.20]
  # Escalado de los parámetros de servicio (minutos_fijos y minutos_por_linea),
  # equivalente a tiempos medios de preparación de 8, 10, 12 y 14 min/pedido.
  factores_servicio: [0.80, 1.00, 1.20, 1.40]
